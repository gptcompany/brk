name: brk

services:
  brk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        anydb: ../../anydb
    image: brk:v0.1.9
    container_name: brk
    restart: unless-stopped
    ports:
      - 127.0.0.1:7070:3110
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BITCOIN_DATA_DIR:-/path/to/bitcoin}:/bitcoin:ro
      - ${BRK_DATA_DIR:-/media/sam/1TB/brk-data}:/home/brk/.brk
    command:
      - --bitcoindir
      - /bitcoin
      - --blocksdir
      - /bitcoin/blocks
      - --brkdir
      - /home/brk/.brk
      - --rpcconnect
      - "${BTC_RPC_HOST:-localhost}"
      - --rpcuser
      - "${BTC_RPC_USER:-bitcoin}"
      - --rpcpassword
      - "${BTC_RPC_PASSWORD:-bitcoin}"
      # Cookie file alternative (uncomment and remove rpcuser/rpcpassword above):
      # - --rpccookiefile
      # - /bitcoin/.cookie
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3110/health"]
      interval: 30s
      # /health can be slow during bitcoind reconnects or heavy catch-up.
      timeout: 45s
      retries: 5
      # Initial full-chain indexing can take many hours before /health is served.
      start_period: 24h
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    labels:
      autoheal: "true"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: brk-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 86400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    name: brk_default
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
